name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

# A newer push on the same ref makes the previous run redundant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint · Types · Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported runtime (see package.json "engines") + current LTS.
        node: [20.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run format:check

  check:
    name: Full check (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder-redis-token
          ABLY_API_KEY: ci-placeholder-ably-key
          RESEND_API_KEY: re_ci_placeholder
          CSRF_SECRET: ci-placeholder-csrf-secret-at-least-32-chars
        run: npm run check

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: next build
        # Placeholders only — the app is designed to build with no real
        # secrets (lib/env.ts validates lazily, integrations fail closed).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder-redis-token
          ABLY_API_KEY: ci-placeholder-ably-key
          RESEND_API_KEY: re_ci_placeholder
          CSRF_SECRET: ci-placeholder-csrf-secret-at-least-32-chars
        run: npm run build

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml

  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: build
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for accurate blame / duplication metrics.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Generate ESLint report
        run: mkdir -p logs/lint && npx eslint . --output-file=logs/lint/eslint-report.json --format json
        continue-on-error: true
      - name: Run SonarQube analysis
        run: npm run sonar
      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a secret committed long ago still fails the scan.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    groups:
      dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels:
      - 'dependencies'
      - 'automated'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    rebase-strategy: 'auto'
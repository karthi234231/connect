# ─── SonarQube analysis configuration ────────────────────────────────────────
# Focuses on the backend: lib/, services/, features/, app/api/, app/actions/, proxy.ts
sonar.projectKey=connect
sonar.projectName=Connect (Backend)
sonar.projectVersion=0.1.0
sonar.host.url=http://localhost:9000

# Backend sources only — exclude client-side React page components that the
# TS sensor mis-counts (line-map mismatch with Turbopack/RSC transforms).
sonar.sources=lib,services,features,app/api,app/actions,proxy.ts
sonar.tests=lib,services,features,app,app/api,app/actions
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8

# Coverage + lint import (if generated)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lint.reportPaths=logs/lint/eslint-report.json

sonar.exclusions=\
node_modules/**,\
.next/**,\
coverage/**,\
supabase/database.types.ts,\
public/**,\
*.log,\
build-log.txt,\
dev-run*.log,\
dev-server*.log,\
tsc-errors.txt,\
AGENTS.md,\
AUDIT_PLAN.md,\
app/**/page.tsx,\
app/**/layout.tsx,\
app/**/error.tsx,\
app/**/not-found.tsx,\
app/(marketing)/**,\
components/**,\
client/**,\
hooks/**,\
store/**,\
config/**,\
utils/**,\
**/*.test.ts,\
**/*.spec.ts

# Exclude auto-generated message catalog from CPD (large constant set).
sonar.cpd.exclusions=lib/messages.ts
